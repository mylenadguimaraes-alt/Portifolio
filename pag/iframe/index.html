<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="../../img/logo.png">

    <title>Início</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 600px;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #e2d5ca;

            font-family: Arial, sans-serif;
        }

        .inicio {
            text-align: center;
            padding: 40px;
        }

        .inicio h1 {
            color: #322030;
            font-size: 40px;
            margin-bottom: 15px;
        }

        .inicio p {
            color: #725b75;
            font-size: 18px;
            line-height: 1.6;
        }

        .linha {
            width: 80px;
            height: 4px;

            margin: 25px auto;

            background-color: #cd8ec6;
            border-radius: 10px;
        }


    </style>

</head>

<body>

    <main class="inicio">

        <h1>Bom dia, me chamo Mylena!</h1>

        <div class="linha"></div>

        <p>
            Seja bem-vindo ao meu portfólio.
            <br>
            Selecione um projeto ao lado para conhecer meu trabalho.
        </p>

    </main>

</body>

</html>
