<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="css/style.css">

        <link rel="icon" type="image/png" href="img/logo.png">

        <title>Inscrição | Ficha do Corredor</title>
    </head>

    <body>
        <header>
            <h1>FICHA DE CORRIDA</h1>
            <p>
                Preencha o <span>formulário</span> abaixo e prepare-se para a largada!
            </p>
        </header>


        <form action="">
            <fieldset>

                <legend>Ficha de corrida</legend>
                
                <div class="dados">
                    
                    <div class="campos">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome"> 
                    </div>
                
                    <div class="campos">
                        <label for="sobrenome">Sobrenome</label>
                        <input type="text" id="sobrenome" name="sobrenome">
                    </div>
               
                </div>

                <div class="dados">           

                    <div class="campos">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" name="cpf">
                    </div>

                    <div class="campos">
                        <label for="telefone">Telefone</label>
                        <input type="text" id="telefone" name="telefone">
                    </div>

                    <div class="campos">
                        <label for="idade">Idade</label>
                        <input type="text" id="idade" name="idade">
                    </div>

                    <div class="campos">
                        
                        <label for="email">E-mail</label>
                        <input type="text" id="email" name="email">

                    </div>


                </div>


                <div class="conteudo_separado">

                    <label class="titulo">Gênero:</label>
                    
                    <div class="opcoes">
                        <input type="radio" value="Masculino" id="masculino" name="sexo">
                        <label for="masculino">Masculino</label>
                    </div>

                    <div class="opcoes">
                        <input type="radio" value="Feminino" id="feminino" name="sexo">
                        <label for="feminino">Feminino</label>
                    </div>

                    <div class="opcoes">
                        <input type="radio" value="Outro" id="outro" name="sexo">
                        <label for="outro">Outro</label>
                    </div>

                </div>
                

                <div class="conteudo_separado">

                    <label class="titulo">Distância:</label>
                    
                    <div class="opcoes">
                        <input type="radio" value="5" id="5km" name="distancia">
                        <label for="5km">5km</label>
                    </div>

                    <div class="opcoes">
                        <input type="radio" value="10" id="10km" name="distancia">
                        <label for="10km">10km</label>
                    </div>

                    <div class="opcoes">
                        <input type="radio" value="15" id="15km" name="distancia">
                        <label for="15km">15km</label>
                    </div>

                </div>

                <div class="conteudo_separado">
                    
                    <label class="titulo">Você deseja: </label>
                    
                    <div class="opcoes">
                        <input type="checkbox" value="Camiseta" id="camiseta" name="itens">
                        <label for="camiseta">Desejo uma camiseta.</label>
                    </div>
                    
                    <div class="opcoes">
                        <input type="checkbox" value="Medalha" id="medalha" name="itens">
                        <label for="medalha">Desejo uma medalha.</label>
                    </div>

                    <div class="opcoes">
                        <input type="checkbox" value="Banana" id="banana" name="itens">
                        <label for="banana">Desejo uma banana.</label>
                    </div>

                </div>
       
                <div id="botao">
                    <input type="submit" value="Enviar Ficha">
                </div>

            </fieldset>
        </form>
    </body>

</html>
